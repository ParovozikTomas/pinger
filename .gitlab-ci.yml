# Pipeline for scheduled site ping + Telegram URL management.
# Create a Pipeline Schedule in GitLab UI (CI/CD → Schedules).
# Tip: use a frequent cron (e.g. */10 * * * *) so /add and /del respond sooner.

stages:
  - ping

variables:
  PING_TIMEOUT: "15"
  NOTIFY_ONLY_ON_FAIL: "false"

ping_site:
  stage: ping
  image: python:3.12-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - python ping.py
  allow_failure: true
